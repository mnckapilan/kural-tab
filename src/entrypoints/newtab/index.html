<!doctype html>

<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <!--
      Critical CSS, inlined so the pre-React paint (before the bundled script
      loads and src/styles/globals.css is applied) isn't a flash of unstyled
      content. This must stay a MINIMAL subset — just the page background and
      text colour for each theme — not a duplicate stylesheet. Keep the values
      in sync with --background/--foreground in src/styles/globals.css. The
      default theme is dark, hence class="dark" on <html>; ThemeContext
      toggles it afterwards. See CLAUDE.md "Styling" section.
    -->
    <style>
      :root {
        --background: #d4d4d4;
        --foreground: #1a1a1a;
      }

      .dark {
        --background: #1a1a1a;
        --foreground: #f2f2f2;
      }

      body {
        background-color: var(--background);
        color: var(--foreground);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
