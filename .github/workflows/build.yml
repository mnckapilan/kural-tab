name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Name of the build artifact"
        required: true
        type: string
      retention_days:
        description: "Number of days to retain the build artifact"
        required: true
        type: number
    outputs:
      artifact_name:
        description: "The name of the built artifact"
        value: ${{ inputs.artifact_name }}

permissions:
  contents: read

jobs:
  build-extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `wxt zip` runs the production build (leaving .output/chrome-mv3/ in place)
      # and zips it to .output/kural-tab-<version>-chrome.zip. Both come from the
      # same build, so the e2e tests (unzipped dir) and the Web Store upload (zip)
      # cover the same bytes.
      - name: Build and zip
        run: npm run zip

      - name: Upload Unzipped Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: .output/chrome-mv3/
          retention-days: ${{ inputs.retention_days }}

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-zip
          path: .output/*-chrome.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
