name: Build and Upload Kural Tab

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*

permissions:
  contents: read

jobs:
  build-extension:
    uses: ./.github/workflows/build.yml
    with:
      artifact_name: kural-tab-${{ github.sha }}
      retention_days: 20

  checks:
    needs: build-extension
    uses: ./.github/workflows/checks.yml
    with:
      artifact_name: kural-tab-${{ github.sha }}

  verify-version:
    name: Verify tag matches package.json version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Compare tag to package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$REF_NAME" ]; then
            echo "Tag $REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi

  upload-extension:
    name: Upload Extension
    runs-on: ubuntu-latest
    needs: [build-extension, checks, verify-version]
    # Only publish to the Chrome Web Store on version tags
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The zip `wxt zip` produced in the build job, i.e. the bytes the e2e tests ran against
      - name: Download zip artifact
        uses: actions/download-artifact@v8
        with:
          name: kural-tab-${{ github.sha }}-zip
          path: .output/

      # `wxt submit` (publish-browser-extension). CHROME_SKIP_SUBMIT_REVIEW uploads a
      # draft only and does not submit it for Google's review: a human submits it from
      # the Developer Dashboard, which is the intentional release gate.
      - name: Upload draft to Chrome Web Store
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: njidhifbpgbfadoffhibkjnnkfhcglpc
          CHROME_PUBLISHER_ID: ${{ secrets.CI_GOOGLE_PUBLISHER_ID }}
          # API v2 in publish-browser-extension authenticates with a Google Cloud service
          # account (not an OAuth refresh token). See CLAUDE.md "CI/CD" for setup.
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CI_GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CI_GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_SKIP_SUBMIT_REVIEW: "true"
        run: npm run submit -- --chrome-zip .output/*-chrome.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: .output/*-chrome.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
